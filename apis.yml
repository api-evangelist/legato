name: Legato Systems
description: >-
  Legato Systems, Inc. was a storage management software company founded in 1988
  in Palo Alto, California by four former Sun Microsystems engineers — Jon
  Kepecs, Bob Lyon, Joe Moran, and Russell Sandberg. Its flagship product,
  NetWorker, was introduced for Unix in 1990 and became one of the defining
  enterprise backup, recovery, and archiving platforms of the client-server era,
  centralizing scheduled backup, media management, and disaster recovery across
  heterogeneous Unix, Windows, and NetWare environments. Backed by Mayfield, the
  company went public in July 1995. EMC Corporation announced its acquisition of
  Legato in July 2003 and completed it in October 2003 for an estimated $1.3
  billion, folding the product line into EMC's information-management portfolio.
  NetWorker survives today as Dell EMC NetWorker following Dell's 2016
  acquisition of EMC. No Legato-branded developer or API surface remains: the
  legato.com domain carries Akamai nameservers but publishes no website, and the
  company predates modern package registries, so no first-party client libraries
  exist. This profile is retained as a historical Mayfield portfolio record.
